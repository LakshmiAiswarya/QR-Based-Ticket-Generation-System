services:
  - type: web
    name: stree-shakti-ticket-portal
    env: node
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /tmp/apsrtc_local.db
      - key: TRAINING_SHEET_PATH
        value: /tmp/exports/ticket_records_training.csv
      - key: ML_SERVICE_URL
        value: https://stree-shakti-ticket-portal-ml-service.onrender.com
  - type: web
    name: stree-shakti-ticket-portal-ml-service
    env: python
    pythonVersion: 3.11
    region: oregon
    branch: main
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ml_service.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/ml_service.db
      - key: MODEL_DIR
        value: /tmp/ml_models
      - key: PYTHONUNBUFFERED
        value: '1'
